<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 입장 화면(캐릭터 조립실): 화면 모양에 맞는 배경 한 장(AVIF, 미지원 브라우저는 건너뛰고 WebP로)과 제목 글꼴 -->
    <link rel="preload" as="image" href="/entry/bg-desktop.avif" type="image/avif" media="(min-aspect-ratio: 1/1)" fetchpriority="high" />
    <link rel="preload" as="image" href="/entry/bg-phone.avif" type="image/avif" media="not all and (min-aspect-ratio: 1/1)" fetchpriority="high" />
    <link rel="preload" as="font" href="/fonts/jua-builder.woff" type="font/woff" crossorigin />
    <meta name="theme-color" content="#171335" />
    <title>caysonverse</title>
    <meta name="description" content="설치 없이 링크로 입장하는 3D 메타버스. 아바타로 함께 걷고 말풍선으로 대화하며, AI 조교와 이야기하고 AI 갤러리를 감상하세요." />
    <!-- Open Graph / 소셜 미리보기 (og:image는 절대 URL 필수) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="caysonverse" />
    <meta property="og:title" content="caysonverse — 함께 걷는 3D 메타버스" />
    <meta property="og:description" content="설치 없이 링크로 입장 · 아바타 · 말풍선 채팅 · AI 조교와 대화 · AI 갤러리. 강의실과 라운지에서 함께 어울리세요." />
    <meta property="og:url" content="https://caysonverseserver-production.up.railway.app/" />
    <!-- 카카오 스크래퍼 안전용: 경량 JPEG(152KB) + 새 URL로 캐시 무효화 -->
    <meta property="og:image" content="https://caysonverseserver-production.up.railway.app/og-v2.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="caysonverse — 함께 걷는 3D 메타버스" />
    <meta name="twitter:description" content="설치 없이 링크로 입장 · 아바타 · 말풍선 채팅 · AI 조교 · AI 갤러리" />
    <meta name="twitter:image" content="https://caysonverseserver-production.up.railway.app/og-v2.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
