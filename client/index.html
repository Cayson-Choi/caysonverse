<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 입장 화면(캐릭터 조립실): 화면 모양에 맞는 배경 한 장(AVIF, 미지원 브라우저는 건너뛰고 WebP로)과 제목 글꼴 -->
    <link rel="preload" as="image" href="/entry/bg-desktop.avif" type="image/avif" media="(min-aspect-ratio: 1/1)" fetchpriority="high" />
    <link rel="preload" as="image" href="/entry/bg-phone.avif" type="image/avif" media="not all and (min-aspect-ratio: 1/1)" fetchpriority="high" />
    <link rel="preload" as="font" href="/fonts/jua-builder.woff" type="font/woff" crossorigin />
    <meta name="theme-color" content="#dfe7ff" />
    <title>케이슨 마을</title>
    <meta name="description" content="로그인 없이 링크로 바로 들어오는 3D 시골 마을. 벚꽃 분수 광장을 걷고, 마을버스를 타고, 호수에서 낚시하고, 추모관에서 반려동물을 기억해요. PC와 휴대폰에서 함께 즐겨요." />
    <link rel="canonical" href="https://caysonverse.vercel.app/" />
    <!-- Open Graph / 소셜 미리보기 (카카오톡·메신저·SNS). og:image는 절대 URL 필수.
         이미지를 바꿀 때는 파일 이름의 버전(og-vN.jpg)을 올린다: 카카오가 옛 이미지를 캐시하기 때문(배포 뒤 카카오 공유 디버거에서 캐시 초기화).
         가족 초대 링크(/?f=...)도 같은 index.html이라 같은 미리보기가 나온다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="케이슨 마을" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="케이슨 마을 — 누구나 쉬어 가는 3D 시골 마을" />
    <meta property="og:description" content="로그인 없이 바로 입장! 벚꽃 광장 산책, 마을버스, 호수 낚시, 반려동물 추모관까지. PC·휴대폰에서 함께 걸어요." />
    <meta property="og:url" content="https://caysonverse.vercel.app/" />
    <meta property="og:image" content="https://caysonverse.vercel.app/og-v3.jpg" />
    <meta property="og:image:secure_url" content="https://caysonverse.vercel.app/og-v3.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="노을 진 케이슨 마을 광장: 벚꽃나무와 초승달 분수, 아바타들, 마을버스가 선 카페" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="케이슨 마을 — 누구나 쉬어 가는 3D 시골 마을" />
    <meta name="twitter:description" content="로그인 없이 바로 입장! 벚꽃 광장 산책, 마을버스, 호수 낚시, 반려동물 추모관까지." />
    <meta name="twitter:image" content="https://caysonverse.vercel.app/og-v3.jpg" />
    <meta name="twitter:image:alt" content="노을 진 케이슨 마을 광장: 벚꽃나무와 초승달 분수, 아바타들, 마을버스가 선 카페" />
  </head>
  <body>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
