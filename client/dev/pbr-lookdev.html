<head><meta charset="utf-8" /><title>PBR lookdev</title>
<style>

#hud a{color:#9cf;margin-right:8px}
</style></head>

<!-- DEV only (not in the build): every M1 PBR set (client/src/village/pbr) on a sphere and a sample surface under the

     ?time=day|night  ?env=g0|none  ?set=<id>&cam=close  ?tier=2k|1k  ?group=ground,stone,... -->

<div id="hud"></div>
<script type="module" src="./pbrLookdev.ts"></script>
